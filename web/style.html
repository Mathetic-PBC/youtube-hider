{{define "style"}}<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#0f0f0f;--muted:#606060;--line:#d0d0d0;--field:#fff;--accent:#0f0f0f;--on-accent:#fff;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--fg:#f1f1f1;--muted:#aaa;--line:#3d3d3d;--field:#121212;--accent:#f1f1f1;--on-accent:#0f0f0f;--warn:#f2b8b5}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(640px,100% - 32px);margin:0 auto}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:16vh}
h1{font-size:22px;line-height:1.3;font-weight:600;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 20px;color:var(--muted)}
input[type=search],input[type=password],textarea{width:100%;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);outline:none}
input[type=search]{height:48px;padding:0 22px;border-radius:24px;font-size:17px}
input[type=password]{height:44px;padding:0 14px;border-radius:10px}
textarea{min-height:112px;padding:12px 14px;border-radius:10px;resize:vertical}
input:focus-visible,textarea:focus-visible{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.error{color:var(--warn)}
</style>{{end}}
